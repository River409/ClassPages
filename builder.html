<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>ClassPages Website Builder</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div id="container">


<div class="header">

<div class="logo">
ClassPages™ Builder
</div>

<div class="tagline">
Create your website without code
</div>

</div>




<table class="nav" width="100%">
<tr>

<td>
<a href="index.html">Home</a>
</td>

<td>
<a href="domains.html">Domains</a>
</td>

<td>
<a href="builder.html">Website Builder</a>
</td>

</tr>
</table>





<div class="box">


<h2>
Choose Editing Mode
</h2>


<button id="easyMode" class="button">

Easy Builder

</button>


<button id="htmlMode" class="button">

HTML Editor

</button>



</div>







<div id="easyBuilder" class="box">


<h2>
Website Settings
</h2>


<p>
Title
</p>

<input id="siteTitle"
placeholder="My Website">



<p>
Tagline
</p>

<input id="siteTagline"
placeholder="Welcome to my site">



<p>
About
</p>

<textarea id="siteAbout"
placeholder="Write about yourself"></textarea>



<p>
Theme Color
</p>


<select id="siteColor">

<option value="#92E81E">
Green
</option>


<option value="#008080">
Teal
</option>


<option value="#663399">
Purple
</option>


<option value="#C2185B">
Pink
</option>


<option value="#E02B1B">
Red
</option>


</select>



<br><br>


<button id="previewButton" class="button">

Preview Website

</button>



</div>








<div id="preview" class="box">


<h2>
Preview
</h2>


</div>







</div>


<script type="module" src="js/builder.js"></script>


</body>

</html>
